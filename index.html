<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ClassQuiz</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cq_theme") || "light";
          if (t === "google") t = "light";
          if (t === "auto")
            t = matchMedia("(prefers-color-scheme:dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-skin", t);
        } catch (e) {
          document.documentElement.setAttribute("data-skin", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Fredoka:wght@500;600&family=Inter:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    />
    <style>
      :root {
        --bg: #fff3dc;
        --card: #fff;
        --tx: #3f2e24;
        --mu: #7a6554;
        --ac: #c2620a;
        --bt: #fff;
        --ok: #2e8b57;
        --no: #c0392b;
        --bd: #ecd3ab;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1f1710;
          --card: #2c2118;
          --tx: #f6e9d8;
          --mu: #c3ad96;
          --ac: #f0a04b;
          --bt: #2a1a0c;
          --ok: #4cc38a;
          --no: #ef7b6e;
          --bd: #4a3a2c;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1f1710;
        --card: #2c2118;
        --tx: #f6e9d8;
        --mu: #c3ad96;
        --ac: #f0a04b;
        --bt: #2a1a0c;
        --ok: #4cc38a;
        --no: #ef7b6e;
        --bd: #4a3a2c;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.35;
        overflow: hidden;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 1.4vh;
        padding: 2vh 3vw;
        box-sizing: border-box;
      }
      .hd {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        font-size: clamp(1rem, 2.6vh, 1.6rem);
        margin: 0;
      }
      .sub {
        color: var(--mu);
        font-size: clamp(0.75rem, 1.8vh, 1rem);
        margin: 0;
      }
      .bar {
        height: 0.9vh;
        min-height: 5px;
        background: var(--bd);
        border-radius: 4px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ac);
        transition: width 0.3s;
      }
      .card {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 1.6vh;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 2.4vh 3vw;
        box-sizing: border-box;
      }
      .tag {
        text-align: center;
        font-size: clamp(0.7rem, 1.7vh, 0.95rem);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--ac);
        font-weight: 700;
      }
      .q {
        text-align: center;
        font-size: clamp(1.1rem, 3.4vh, 2.1rem);
        font-weight: 700;
        margin: 0;
        align-self: center;
      }
      .q.big {
        flex: 1;
        display: flex;
        align-items: center;
        font-size: clamp(1.4rem, 5vh, 3rem);
      }
      .imgs {
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        gap: 3vw;
      }
      .imgs figure {
        margin: 0;
        height: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6vh;
      }
      .imgs img {
        flex: 1 1 auto;
        min-height: 0;
        object-fit: contain;
        border-radius: 12px;
        border: 1px solid var(--bd);
      }
      .imgs figcaption {
        font-weight: 800;
        font-size: clamp(1rem, 2.6vh, 1.5rem);
      }
      .opts {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.4vh 1.6vw;
        width: 100%;
        align-self: center;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: clamp(46px, 9vh, 84px);
        font: inherit;
        font-size: clamp(0.95rem, 2.5vh, 1.5rem);
        text-align: left;
        color: inherit;
        background: transparent;
        border: 2px solid var(--bd);
        border-radius: 12px;
        padding: 0 16px;
        cursor: pointer;
      }
      .opt:hover:not(:disabled) {
        border-color: var(--ac);
      }
      .opt:disabled {
        cursor: default;
      }
      .opt.ok {
        border-color: var(--ok);
        background: color-mix(in srgb, var(--ok) 18%, transparent);
      }
      .opt.no {
        border-color: var(--no);
        background: color-mix(in srgb, var(--no) 18%, transparent);
      }
      .lt {
        flex: none;
        width: 2.2em;
        height: 2.2em;
        border-radius: 50%;
        border: 2px solid var(--bd);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 0.8em;
      }
      .fb {
        min-height: clamp(46px, 9vh, 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2vw;
        font-size: clamp(0.85rem, 2.2vh, 1.3rem);
        text-align: center;
        color: var(--mu);
        padding: 0 1vw;
      }
      .fb.done {
        color: var(--tx);
      }
      .fb b {
        color: var(--ok);
      }
      .btn {
        flex: none;
        background: var(--ac);
        color: var(--bt);
        border: 2px solid var(--ac);
        border-radius: 12px;
        padding: 1.2vh 2.4vw;
        font: inherit;
        font-weight: 700;
        font-size: clamp(0.95rem, 2.3vh, 1.3rem);
        cursor: pointer;
      }
      .btn.alt {
        background: transparent;
        color: var(--ac);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .pg {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5vw;
      }
      .wbox {
        position: relative;
        flex: none;
        width: min(46vw, 68vh);
        height: auto;
        aspect-ratio: 1;
        display: flex;
      }
      #wc {
        width: 100%;
        height: 100%;
      }
      .ptr {
        position: absolute;
        left: 50%;
        top: -1%;
        transform: translateX(-50%);
        border-left: 2.2vh solid transparent;
        border-right: 2.2vh solid transparent;
        border-top: 4.4vh solid var(--tx);
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35));
      }
      .side {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 2vh;
      }
      .score {
        font-size: clamp(2rem, 9vh, 5rem);
        font-weight: 800;
        line-height: 1;
      }
      .who {
        font-size: clamp(1.3rem, 5vh, 3rem);
        font-weight: 800;
        color: var(--ac);
        min-height: 1.2em;
        overflow-wrap: anywhere;
      }
      .msg,
      .left {
        color: var(--mu);
        font-size: clamp(0.9rem, 2.3vh, 1.3rem);
        margin: 0;
      }
      .left {
        font-size: clamp(0.8rem, 2vh, 1.1rem);
        line-height: 1.5;
      }
      .kg {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 16px;
        width: 100%;
      }
      .kc {
        font: inherit;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: var(--t-sf, var(--card));
        color: var(--t-sfx, var(--tx));
        border: 1px solid var(--t-bd, var(--bd));
        border-radius: 16px;
        padding: 20px;
        cursor: pointer;
        transition: box-shadow 0.15s, border-color 0.15s;
      }
      .kc:hover:not(:disabled) {
        border-color: var(--t-ac, var(--ac));
      }
      .kc:disabled {
        opacity: 0.75;
        cursor: default;
      }
      .kc i {
        font-style: normal;
        width: 44px;
        height: 44px;
        margin-bottom: 6px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        background: color-mix(in srgb, var(--t-ac, var(--ac)) 28%, transparent);
        color: var(--t-sfx, var(--tx));
      }
      .kc b {
        font-size: 1.1rem;
      }
      .kc span {
        color: color-mix(in srgb, currentColor 78%, transparent);
        font-size: 0.9rem;
        line-height: 1.4;
      }
      .stt {
        margin: 0;
        text-align: center;
        font-size: clamp(1.3rem, 3.6vh, 2.2rem);
      }
      .dt {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 0.8vh 14px;
      }
      .dt > summary {
        cursor: pointer;
        font-weight: 700;
        padding: 0.6vh 0;
      }
      .dt[open] > summary {
        margin-bottom: 1vh;
      }
      .dt > .acts,
      .dt > .rows {
        justify-content: center;
      }
      .setup {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.4vh;
      }
      textarea {
        flex: 1;
        min-height: 0;
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: clamp(0.95rem, 2.4vh, 1.35rem);
        color: var(--tx);
        background: transparent;
        border: 2px solid var(--bd);
        border-radius: 10px;
        padding: 1vh 1vw;
        resize: none;
      }
      textarea:focus {
        outline: none;
        border-color: var(--ac);
      }
      label {
        color: var(--mu);
        font-size: clamp(0.85rem, 2.1vh, 1.2rem);
      }
      .acts {
        display: flex;
        gap: 1.5vw;
      }
      @media (max-width: 700px) {
        body {
          overflow: auto;
        }
        main {
          height: auto;
          min-height: 100%;
        }
        .opts {
          grid-template-columns: 1fr;
        }
        .imgs {
          min-height: 30vh;
        }
        .pg {
          flex-direction: column;
        }
        .wbox {
          height: auto;
          width: 90vw;
        }
      }
      #cf {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9;
      }
      .rows {
        width: 100%;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1vh;
        padding: 2px;
      }
      .row {
        display: flex;
        gap: 1vw;
        align-items: center;
      }
      .row input {
        font: inherit;
        font-size: clamp(0.95rem, 2.4vh, 1.35rem);
        color: var(--tx);
        background: transparent;
        border: 2px solid var(--bd);
        border-radius: 10px;
        padding: 1vh 1vw;
        min-width: 0;
        box-sizing: border-box;
      }
      .row .pn {
        flex: 1;
      }
      .row .pq {
        width: 5.5em;
        text-align: center;
      }
      .row .x {
        background: transparent;
        color: var(--no);
        border: 2px solid var(--bd);
        border-radius: 10px;
        font: inherit;
        font-weight: 800;
        padding: 1vh 1vw;
        cursor: pointer;
      }
      #ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 8;
        padding: 2vh 3vw;
        box-sizing: border-box;
      }
      .win {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 2.4vh 3vw;
        width: min(92vw, 520px);
        overflow: auto;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1.6vh;
      }
      .win .wbox {
        height: auto;
        width: min(80vw, 44vh);
      }
      .slot {
        flex: none;
        width: min(80vw, 520px);
        height: min(26vh, 150px);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 4px solid var(--ac);
        border-radius: 16px;
        background: var(--bg);
        font-size: clamp(1.4rem, 6vh, 3.6rem);
        font-weight: 800;
        overflow: hidden;
        padding: 0 2vw;
        box-sizing: border-box;
        text-align: center;
        overflow-wrap: anywhere;
      }
      .win .slot {
        width: 100%;
      }
      .setup {
        overflow-y: auto;
        width: 100%;
        justify-content: flex-start;
      }
      .setup textarea {
        flex: none;
        height: 16vh;
        min-height: 90px;
      }
      .setup .rows {
        flex: none;
        min-height: 60px;
      }
      .acts {
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      select {
        font: inherit;
        font-size: clamp(0.9rem, 2.2vh, 1.2rem);
        color: var(--tx);
        background: var(--card);
        border: 2px solid var(--bd);
        border-radius: 10px;
        padding: 0.8vh 1vw;
      }
      .edf {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1vh;
      }
      .edf label {
        display: flex;
        flex-direction: column;
        gap: 0.4vh;
        font-size: clamp(0.8rem, 2vh, 1.1rem);
      }
      .edf input:not([type]),
      .edf textarea {
        font: inherit;
        font-size: clamp(0.9rem, 2.2vh, 1.2rem);
        color: var(--tx);
        background: transparent;
        border: 2px solid var(--bd);
        border-radius: 10px;
        padding: 0.8vh 1vw;
        box-sizing: border-box;
      }
      .edf textarea {
        height: 9vh;
        min-height: 60px;
      }
      .edf .row input[type="radio"] {
        padding: 0;
        border: 0;
        min-width: 0;
        flex: none;
        width: 1.4em;
        height: 1.4em;
        accent-color: var(--ac);
      }
      :root,
      :root:not([data-theme="light"]),
      :root[data-theme="dark"] {
        --bg: #2f221a;
        --card: #3f2e24;
        --tx: #fff;
        --mu: #fff1d9;
        --ac: #fdc800;
        --bt: #3f2e24;
        --ok: #2e8b57;
        --no: #c0392b;
        --bd: rgba(255, 255, 255, 0.28);
        color-scheme: light;
      }
      body {
        font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
        font-weight: 500;
        background:
          radial-gradient(
            circle at 80% 16%,
            rgba(255, 226, 140, 0.6) 0 13vh,
            rgba(255, 226, 140, 0) 13.3vh
          ),
          linear-gradient(#d16600, #e08a00 48%, #fdc800);
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        top: 0;
        bottom: 0;
        background:
          url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'><g fill='%23efe6cf'><circle cx='60' cy='58' r='28'/><circle cx='98' cy='42' r='36'/><circle cx='140' cy='58' r='28'/><rect x='40' y='58' width='120' height='28' rx='14'/></g></svg>")
            4vw 9vh/14vw auto no-repeat,
          url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'><g fill='%23efe6cf'><circle cx='60' cy='58' r='28'/><circle cx='98' cy='42' r='36'/><circle cx='140' cy='58' r='28'/><rect x='40' y='58' width='120' height='28' rx='14'/></g></svg>")
            66vw 3vh/10vw auto no-repeat;
      }
      body::after {
        bottom: 0;
        height: 24vh;
        background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 240' preserveAspectRatio='none'><g fill='%23e8870c'><rect x='10' y='110' width='80' height='130'/><rect x='100' y='60' width='55' height='180'/><polygon points='110,60 127,10 145,60'/><rect x='170' y='130' width='90' height='110'/><rect x='280' y='80' width='60' height='160'/><rect x='360' y='140' width='100' height='100'/><rect x='480' y='50' width='55' height='190'/><rect x='550' y='120' width='80' height='120'/><rect x='650' y='90' width='60' height='150'/><rect x='730' y='140' width='90' height='100'/><rect x='840' y='60' width='55' height='180'/><rect x='910' y='120' width='80' height='120'/><rect x='1010' y='80' width='60' height='160'/><rect x='1090' y='130' width='100' height='110'/></g><g fill='%23dd6a1f'><rect x='60' y='150' width='60' height='90'/><rect x='200' y='110' width='50' height='130'/><rect x='320' y='150' width='60' height='90'/><rect x='440' y='100' width='50' height='140'/><rect x='600' y='150' width='60' height='90'/><rect x='770' y='110' width='50' height='130'/><rect x='880' y='150' width='60' height='90'/><rect x='1000' y='110' width='50' height='130'/></g></svg>")
          center bottom/100% 100% no-repeat;
      }
      main {
        position: relative;
        z-index: 1;
        padding: 2.4vh 4vw 3vh;
      }
      h1,
      .btn,
      .score,
      .who,
      .slot {
        font-family: Aliengo, Chewy, "Trebuchet MS", system-ui, sans-serif;
        font-weight: 400;
      }
      .sub,
      .tag,
      .lt {
        font-family:
          "Sugo Pro Classic", "Sugo Classic", Sugo, "Barlow Condensed",
          system-ui, sans-serif;
        font-weight: 700;
      }
      h1 {
        color: #fff;
        font-size: clamp(1.4rem, 4.4vh, 2.6rem);
        text-shadow: 0 0.07em 0 #e8870c;
        letter-spacing: 0.02em;
      }
      .sub {
        color: #fff;
        font-size: clamp(0.9rem, 2.2vh, 1.3rem);
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(63, 46, 36, 0.5);
      }
      .bar {
        background: rgba(63, 46, 36, 0.35);
        height: 1.2vh;
      }
      .bar i {
        background: #fff;
        border-radius: 4px;
      }
      .card {
        background: #3f2e24;
        color: #fff;
        border: 0;
        border-radius: 44px 70px 52px 78px/60px 46px 70px 50px;
        padding: 3vh 4vw;
        box-shadow: 0 1.2vh 0 rgba(0, 0, 0, 0.18);
      }
      .tag {
        align-self: center;
        background: #fff;
        color: #3f2e24;
        border-radius: 999px;
        padding: 0.6vh 1.8vw;
        font-size: clamp(0.85rem, 2.1vh, 1.2rem);
        letter-spacing: 0.03em;
        text-transform: none;
      }
      .q {
        font-weight: 600;
        font-size: clamp(1.4rem, 4.4vh, 2.8rem);
        line-height: 1.15;
      }
      .q.big {
        font-size: clamp(1.7rem, 6vh, 3.6rem);
      }
      .opt {
        background: #fff;
        color: #3f2e24;
        border: 3px solid #fff;
        border-radius: 999px;
        font-weight: 600;
        font-size: clamp(1.1rem, 3.1vh, 1.9rem);
        padding: 0 1.4vw 0 0.8vw;
      }
      .opt:hover:not(:disabled) {
        border-color: #fdc800;
        background: #fff7d6;
      }
      .opt:disabled {
        opacity: 1;
      }
      .opt.ok {
        background: #c9f2d6;
        border-color: #2e8b57;
      }
      .opt.no {
        background: #ffd6cf;
        border-color: #c0392b;
      }
      .lt {
        background: #fdc800;
        border: 0;
        color: #3f2e24;
        font-size: 1em;
      }
      .fb {
        color: #fff1d9;
        font-size: clamp(1rem, 2.7vh, 1.6rem);
      }
      .fb.done {
        color: #fff;
      }
      .fb b {
        color: #7fe0a1;
      }
      .btn {
        background: #fdc800;
        color: #3f2e24;
        border: 0;
        border-radius: 999px;
        padding: 1.2vh 3vw;
        font-size: clamp(1.05rem, 2.8vh, 1.6rem);
        box-shadow: 0 0.5vh 0 #b8860b;
      }
      .btn:active {
        transform: translateY(0.3vh);
        box-shadow: 0 0.2vh 0 #b8860b;
      }
      .btn.alt {
        background: transparent;
        color: #fff;
        border: 2px solid #fdc800;
        box-shadow: none;
      }
      .who,
      .score {
        color: #fdc800;
      }
      .who {
        font-size: clamp(1.6rem, 6vh, 3.6rem);
      }
      .msg,
      .left,
      label {
        color: #fff1d9;
        font-size: clamp(1rem, 2.6vh, 1.5rem);
      }
      .imgs img {
        border: 0;
        background: #2f221a;
      }
      .ptr {
        border-top-color: #fdc800;
      }
      #wc {
        border-radius: 50%;
        box-shadow:
          0 0 0 0.9vh #fdc800,
          0 1.3vh 0 0.9vh rgba(0, 0, 0, 0.2);
      }
      .win {
        background: #3f2e24;
        border: 0;
        border-radius: 36px 56px 40px 60px/48px 36px 56px 40px;
      }
      .slot {
        background: #2f221a;
        border-color: #fdc800;
        color: #fff;
      }
      textarea,
      .row input,
      .edf input:not([type]),
      .edf textarea {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
      select {
        background: #4d3a2e;
        color: #fff;
        border-color: rgba(255, 255, 255, 0.3);
      }
      textarea:focus {
        border-color: #fdc800;
      }
      #fs {
        position: fixed;
        right: 1.4vw;
        bottom: 1.6vh;
        z-index: 6;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 0.7vh 1.4vw;
        font:
          600 clamp(0.8rem, 1.9vh, 1.05rem) "Barlow Condensed",
          system-ui,
          sans-serif;
        cursor: pointer;
        backdrop-filter: blur(6px);
      }
      .opt {
        transition:
          transform 0.12s,
          background 0.12s,
          border-color 0.12s;
        box-shadow: 0 0.6vh 0 rgba(0, 0, 0, 0.18);
      }
      .opt:hover:not(:disabled) {
        transform: translateY(-2px);
      }
      body.play main {
        padding: 0;
        gap: 0;
      }
      body.play .hd {
        display: none;
      }
      body.play .bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 0.8vh;
        min-height: 5px;
        border-radius: 0;
        background: rgba(255, 255, 255, 0.12);
        z-index: 5;
      }
      body.play .bar i {
        background: #fdc800;
        border-radius: 0;
      }
      body.play .card {
        border-radius: 0;
        box-shadow: none;
        gap: 2.6vh;
        padding: 5vh 6vw 7vh;
        background: radial-gradient(
          120% 90% at 85% -10%,
          #5b4132 0,
          #3f2e24 55%,
          #33251c
        );
      }
      body.play .tag {
        background: rgba(255, 255, 255, 0.13);
        color: #fff1d9;
        font-size: clamp(0.8rem, 1.9vh, 1.1rem);
      }

      .sub,
      .tag,
      .lt {
        font-weight: 400;
      }
      #wc {
        display: block;
      }
      body::before,
      body::after {
        content: none;
        display: none;
      }
      body {
        background: linear-gradient(#d16600, #e8870c 45%, #fdc800) fixed;
      }
      h1,
      .btn,
      .score,
      .who,
      .slot,
      .sub,
      .tag,
      .lt {
        font-family: "Barlow Condensed", system-ui, sans-serif;
        font-weight: 700;
      }
      .tag,
      .lt {
        font-weight: 600;
      }
      .bar,
      body.play .bar {
        display: none;
      }
      #fs {
        transition: opacity 0.25s;
      }
      body.fsm #fs {
        opacity: 0;
      }
      body.fsm.mv #fs,
      body.fsm #fs:hover {
        opacity: 1;
      }

      /* Clean, page-first scrolling: no nested scroll areas or visible scrollbars. */
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      main {
        height: auto;
        min-height: 100vh;
      }
      .card {
        flex: none;
        min-height: calc(100vh - 4vh - 3vh);
      }
      .setup {
        flex: none;
        min-height: 0;
        overflow: visible;
        width: 100%;
        justify-content: flex-start;
      }
      textarea,
      .setup textarea,
      .edf textarea {
        flex: none;
        height: auto;
        min-height: 10rem;
        max-height: none;
        overflow: hidden;
        resize: vertical;
      }
      .rows,
      .setup .rows {
        flex: none;
        min-height: 0;
        height: auto;
        overflow: visible;
      }
      #ov {
        position: absolute;
        align-items: flex-start;
        min-height: 100%;
        height: auto;
      }
      .win {
        overflow: visible;
        max-height: none;
      }
      @media (max-width: 700px) {
        main {
          height: auto;
          min-height: 100vh;
        }
        .card {
          min-height: calc(100vh - 4vh - 3vh);
        }
      }

      /* Clean full-screen look: no card panel */
      .card,
      body.play .card {
        background: transparent !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        border: 0 !important;
      }
      #fs {
        display: none !important;
      }
      main,
      body.play main {
        padding: 0 !important;
      }
      main,
      body.play main {
        min-height: 100vh !important;
        min-height: 100dvh !important;
      }
      .card,
      body.play .card {
        min-height: 100vh !important;
        min-height: 100dvh !important;
        box-sizing: border-box;
        justify-content: center;
      }
      body.play .card {
        padding: 5vh 6vw !important;
      }
      #ov {
        position: fixed !important;
        inset: 0 !important;
        height: auto !important;
        min-height: 0 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        overflow: auto !important;
      }
      #ov .win {
        margin: auto !important;
        max-height: none;
        text-align: center;
        align-items: center;
      }

      /* Slot machine: vertical reel and lever */
      .slotm {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.4vw;
        max-width: 100%;
      }
      .slotm .slot {

        width: min(66vw, 520px);

      .vp {
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(
          transparent,
          #000 24%,
          #000 76%,
          transparent
        );
        mask-image: linear-gradient(
          transparent,
          #000 24%,
          #000 76%,
          transparent
        );

        display: flex;
        flex-direction: column;
        will-change: transform;

        flex: none;
        height: var(--sh);
        width: 100%;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 2vw;
        overflow-wrap: anywhere;
        line-height: 1.1;
      }
      .reel.go .cell {
        filter: blur(0.7px);
      }
      .lever {
        flex: none;
        position: relative;
        width: clamp(34px, 6vh, 56px);
        height: min(26vh, 150px);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .lever:disabled {
        cursor: default;
      }
      .lever .arm {
        position: absolute;
        left: 50%;
        top: 10%;
        bottom: 50%;
        width: max(6px, 0.8vh);
        margin-left: max(-3px, -0.4vh);
        border-radius: 4px;
        background: linear-gradient(90deg, #8a8f99, #e7e9ee 45%, #8a8f99);
        transform-origin: 50% 100%;
      }
      .lever .knob {
        position: absolute;
        left: 50%;
        top: max(-1.7vh, -14px);
        width: max(24px, 3.6vh);
        height: max(24px, 3.6vh);
        margin-left: max(-12px, -1.8vh);
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #ff8a7d,
          #d32f2f 60%,
          #8e1a1a
        );
        box-shadow: 0 0.4vh 0.8vh rgba(0, 0, 0, 0.35);
      }
      .lever .hub {
        position: absolute;
        left: 50%;
        top: 50%;
        width: max(16px, 2.6vh);
        height: max(16px, 2.6vh);
        margin: max(-8px, -1.3vh) 0 0 max(-8px, -1.3vh);
        border-radius: 50%;
        background: var(--ac, #fdc800);
        border: 3px solid rgba(0, 0, 0, 0.35);
      }
      .lever:not(:disabled):hover .knob {
        filter: brightness(1.12);
      }
      .lever.pull .arm {
        animation: pull 1.4s cubic-bezier(0.45, 0, 0.25, 1) forwards;
      }
      @keyframes pull {
        0% {
          transform: rotate(0);
        }
        22% {
          transform: rotate(180deg);
        }
        62% {
          transform: rotate(180deg);
        }
        100% {
          transform: rotate(0);
        }
      }
      .lever:active:not(:disabled) .arm {
        transform: rotate(22deg);
      }

      (function () {

          try {
            localStorage.setItem("cq_theme", t);

        }
        function apply() {
          var r = cur === "auto" ? (mq.matches ? "dark" : "light") : cur;

          }

          ? mq.addEventListener("change", function () {

      })();

          clearTimeout(it);
          it = setTimeout(function () {
            if (!ov.classList.contains("open") && document.activeElement !== mb)
              mb.classList.add("idle");
          }, 3000);
        }
        ["mousemove", "mousedown", "touchstart", "keydown", "wheel"].forEach(
          function (n) {
            document.addEventListener(n, wake, { passive: true });
          },
        );
        mb.addEventListener("focus", wake);
        wake();
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            if (ov.classList.contains("open")) {
              e.preventDefault();
              close();
            } else {
              var t = e.target && e.target.tagName;
              if (t !== "INPUT" && t !== "TEXTAREA" && t !== "SELECT") home();
            }
          }
        });
      })();
    </script>
  </body>
</html>
